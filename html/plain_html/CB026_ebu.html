<p><b>III</b></p>
<p>Si vocatus ad nuptias </p>
<p>advenias </p>
<p>sine veste nuptiali, </p>
<p>a curia regali </p>
<p>expelleris, </p>
<p>et obviam si veneris </p>
<p>sponso lampade vacua, </p>
<p>es quasi virgo fatua. </p>
<p><b>IV</b></p>
<p>Ergo vide, ne dormias, </p>
<p>set vigilans aperias </p>
<p>Domino, cum pulsaverit. </p>
<p>Beatus quem invenerit </p>
<p>vigilantem cum invenerit! </p>
