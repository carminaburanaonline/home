<p><b>I</b></p>
<p>Surrexit de cumulo  fulgens plus quam stella </p>
<p>frangit in diluculo  hostis dica bella </p>
<p><b>II</b></p>
<p>Nitam dedit seculo  celi prebens mella </p>
<p>da cruoris rivulo  gaudia novella </p>
<p><b>III</b></p>
<p>dulce leta concio  pangat alleluya. </p>
