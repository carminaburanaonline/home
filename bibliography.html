<!DOCTYPE html>
<html lang="en">
  <head>
    <title>CBO Bibliography</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <!-- Add additional CSS in static file -->
    <link rel="stylesheet" href="css/ui-components.css"/>
    <link rel="stylesheet" href="css/layout-generic.css"/>
    <style>
      .bib-entry {
        margin-bottom: 1em;
      }
      .bib-sort-button {
        display: block;
        margin-top: 15px;
      }
      #bib-search {
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <div class="page-container">
      <!-- Navbar + header -->
      <div data-include="header"></div>

      <div class="page-title">Bibliography</div>

      <main style="display: flex; flex: 1;">
        <div id="bib-controls" class="flex-column" style="flex: 20%">
          <input id="bib-search" type="search" placeholder="Search...">
          <div>
            <button id="sort-author" class="bib-sort-button" data-i18n="sortAuthor"></button>
            <button id="sort-title" class="bib-sort-button" data-i18n="sortTitle"></button>
            <button id="sort-year" class="bib-sort-button" data-i18n="sortYear"></button>
          </div>
        </div>

        <div id="bib-results" class="flex-column" style="flex: 80%">
        </div>
      </main>

      <!-- Footer -->
      <footer class="cbo-center cbo-black cbo-padding-16" data-include="footer"></footer>
    </div>

    <script type="module">
      import { initPage } from './js/initPage.js';
      import { renderBibliographyPage } from './js/bibliography/bibliographyPage.js';

      initPage(renderBibliographyPage);
    </script>


  </body>
</html>
